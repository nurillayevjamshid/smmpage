apiVersion: apps/v1
kind: Deployment
metadata:
  name: daily-api
  labels: { app: daily-api }
spec:
  replicas: 3
  selector: { matchLabels: { app: daily-api } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata: { labels: { app: daily-api } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/example/daily-api:IMAGE_TAG
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ secretRef: { name: daily-runtime-secrets } }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
          readinessProbe: { httpGet: { path: /ready, port: http }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /live, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
---
apiVersion: v1
kind: Service
metadata: { name: daily-api }
spec:
  selector: { app: daily-api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: daily-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: daily-api }
  minReplicas: 3
  maxReplicas: 50
  behavior: { scaleDown: { stabilizationWindowSeconds: 300 } }
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 75 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: daily-api }
spec: { minAvailable: 2, selector: { matchLabels: { app: daily-api } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: daily-api
  annotations: { nginx.ingress.kubernetes.io/proxy-read-timeout: "60" }
spec:
  ingressClassName: nginx
  rules:
    - host: api.daily.example
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: daily-api, port: { number: 80 } } } }]
